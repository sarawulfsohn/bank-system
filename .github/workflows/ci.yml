name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx next lint
      - run: bun test
      - run: bunx next build
      # Informational: dev-tool advisories shouldn't block a release, but should be seen
      - run: bun audit
        continue-on-error: true
